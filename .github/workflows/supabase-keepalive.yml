# Giữ Supabase (gói Free) không bị tự pause sau ~7 ngày không hoạt động.
# Chạy 3 ngày/lần: ghi 1 heartbeat vào bảng settings rồi đọc lại → có query thật vào DB.
# Có thể bấm chạy tay ở tab Actions → "Supabase keep-alive" → Run workflow.
#
# Cần khai báo 2 repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       = https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  = anon key của project
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Write heartbeat
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/settings" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"key\":\"keepalive\",\"value\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Read back
        run: |
          curl --fail-with-body -sS "$SUPABASE_URL/rest/v1/settings?key=eq.keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
